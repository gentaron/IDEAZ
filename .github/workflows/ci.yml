name: Editorial evidence gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent source-grounded topic selections (no APIs)
        run: npm test
