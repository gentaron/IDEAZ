name: 毎日5枠を入れ替える

on:
  schedule:
    # 21:00 UTC = マレーシア時間 翌朝 05:00
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '作り直す日付 (YYYY-MM-DD)。空なら当日'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-formats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # 今日の題材を探す。ここが本体。
      # 落ちても止めない。題材が無ければ、その日は角度だけ配った5枠になる。
      - name: 今日の題材を探す
        id: search
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY が無い。探索は飛ばす（角度だけの5枠になる）"
            exit 0
          fi
          node scripts/search.mjs ${{ github.event.inputs.date }}

      - name: 5枠を生成する
        run: node scripts/generate.mjs ${{ github.event.inputs.date }}

      - name: 変わっていればコミットする
        run: |
          git config user.name  "ideaz-bot"
          git config user.email "ideaz-bot@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "変化なし。コミットしない"
          else
            DATE=$(node -e "console.log(require('./docs/data/current.json').date)")
            SRC=$(node -e "console.log(require('./docs/data/current.json').topicSource)")
            git commit -m "フォーマット更新 ${DATE}（${SRC}）"
            git push
          fi

      - name: 探索が落ちていたら知らせる
        if: steps.search.outcome == 'failure'
        run: echo "::warning::今日の題材探索が失敗した。角度だけの5枠を出している。"

      - name: Netlify に作り直させる（ビルドフックがあるときだけ）
        # リポジトリに Netlify を繋いでいれば、上の push だけで勝手に建て直る。
        # このステップは、繋いでいない・別経路で建てたいときの保険。
        # Settings → Secrets → Actions に NETLIFY_BUILD_HOOK を入れると動く。
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK" > /dev/null && echo "Netlify に投げた"
