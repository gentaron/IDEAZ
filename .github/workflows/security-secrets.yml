name: Secret-history scan (independent of daily content generation)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install pinned scanner outside the content pipeline
        run: go install github.com/zricethezav/gitleaks/v8@v8.29.0
      - name: Scan all Git history (redacted)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
