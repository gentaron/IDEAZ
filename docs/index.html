<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDEAZ — 1日5枠のブログ・フォーマット</title>

<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IDEAZ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<meta property="og:type" content="website">
<meta property="og:title" content="IDEAZ — 1日5枠のブログ・フォーマット">
<meta property="og:description" content="毎朝5時に入れ替わる5個のプロンプト。コピーしてAIに投げるだけ。">

<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#cards">本文へ</a>

<header class="top">
  <div class="top-row">
    <h1>IDEAZ</h1>
    <div class="top-actions">
      <button id="install-btn" class="ghost small" type="button" hidden>インストール</button>
      <button id="archive-btn" class="ghost small" type="button" aria-haspopup="dialog">アーカイブ</button>
    </div>
  </div>
  <p class="meta">
    <span id="date-label">読み込み中</span>
    <span class="dot" aria-hidden="true">·</span>
    <span id="next-label"></span>
  </p>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-text"></span>
  <button id="banner-action" class="banner-btn" type="button" hidden></button>
  <button id="banner-close" class="banner-x" type="button" aria-label="閉じる">×</button>
</div>

<main id="cards" aria-live="polite" aria-busy="true"></main>

<p class="footnote">
  毎朝5時（マレーシア時間）に5個とも入れ替わります。古い分はアーカイブに残ります。<br>
  文面の正本はリポジトリの <code>memory/</code>。そこを直すと翌朝から反映されます。
</p>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-head">
    <strong id="viewer-title"></strong>
    <button id="viewer-close" class="ghost small" type="button">閉じる</button>
  </div>
  <pre id="viewer-body" tabindex="0"></pre>
  <div class="viewer-foot">
    <button id="viewer-copy" class="primary" type="button">全文をコピー</button>
    <button id="viewer-share" class="ghost" type="button" hidden>共有</button>
  </div>
</dialog>

<dialog id="archive" aria-labelledby="archive-title">
  <div class="viewer-head">
    <strong id="archive-title">アーカイブ</strong>
    <button id="archive-close" class="ghost small" type="button">閉じる</button>
  </div>
  <div id="archive-list" class="archive-list"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js" type="module"></script>
</body>
</html>
